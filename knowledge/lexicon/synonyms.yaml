# Словарь лексической близости: группы взаимозаменяемых терминов.
#
# Как читать:
#   canonical — лемма понятия (первое слово группы);
#   aliases   — остальные названия, включая латиницу;
#   status    — approved (участвует в проверке) | proposed (ждёт человека);
#   source    — manual | llm;
#   added     — дата добавления;
#   model     — модель, предложившая запись (если source: llm).
#
# ВАЖНО: файл дополняет встроенный набор (src/pf/synonyms.py), а не
# заменяет его. Удаление группы отсюда не убирает её из проверки — для
# этого нужно править встроенный набор. Записи со статусом proposed в
# проверке НЕ участвуют: подтверждает словарь человек.
#
# Пополнение: `pf lexicon oov` → `pf lexicon enrich --dry-run` →
# `pf lexicon enrich` → `pf lexicon approve <слово>`.
version: 1
