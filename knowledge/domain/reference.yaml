# Тематический справочник: знание о применимости понятий, а не факт о кейсе.
#
# Правило `domain-reference-is-not-case-fact`: справочник отвечает на вопрос
# «как это обычно бывает», а не «что было у нас». Его статус — «требует
# проверки»; он не пополняет подтверждённые основания по делу. Источник
# понятия здесь не приводится намеренно: это не измерение, а рамка мышления.
reference:
  - id: esim
    term: eSIM
    what: >
      Встроенный SIM-профиль: подключение оформляется удалённо, без
      пластиковой карты, и переносится между устройствами профилем.
    applies_when: >
      Аудитория ценит скорость подключения и путешествует, а продажа идёт
      в цифровом канале.
    not_when: >
      Нужна поддержка старых устройств или клиент не может сам установить
      профиль.

  - id: mvno
    term: MVNO (виртуальный оператор)
    what: >
      Оператор без собственной сети: арендует радиодоступ у базового
      оператора и продаёт связь под своим брендом.
    applies_when: >
      Сегмент чувствителен к цене и не привязан к бренду, а своей сети и
      лицензии нет.
    not_when: >
      Нужны гарантированное покрытие и ёмкость, а базовый оператор диктует
      условия.

  - id: arpu
    term: ARPU
    what: >
      Средняя выручка на абонента за период: доход, делённый на число
      абонентов.
    applies_when: >
      Сравнивают монетизацию одного и того же сегмента во времени.
    not_when: >
      Сравнивают операторов с разной структурой базы: разовые продажи и
      абонплата смешиваются.

  - id: key-rate
    term: Ключевая ставка
    what: >
      Процент, под который центральный банк даёт деньги банкам; влияет на
      стоимость кредита и склонность абонента экономить.
    applies_when: >
      Объясняют общий фон решений о цене и дополнительных услугах.
    not_when: >
      Выводят из неё отток конкретного продукта: связь макро-фона и
      поведения абонента не доказана.
