# Домен проекта: субъекты, термины и шаблоны заголовков.
#
# Как читать:
#   subjects.canonical — каноническое имя, как оно пишется в утверждении;
#   subjects.aliases   — другие написания того же имени (латиница, разговорное);
#   subjects.kind      — operator (компания) | category (категория рынка);
#   subjects.ours      — наш бренд: коммуникация идёт от его имени;
#   subjects.competitor — имя чужого бренда, недопустимое в ключевом сообщении;
#   terms[].word       — словоформа домена;
#   terms[].strong/clean/domain — в каких наборах участвует словоформа:
#       strong — без неё совпадение доменного слова считается случайным;
#       clean  — отобрана замером как не встречающаяся в чужих областях;
#       domain — участвует во взвешивании выдачи;
#   search.strong_terms/stems — слова и основы отбора новостей по теме;
#   patterns.operator  — текст называет оператора связи;
#   patterns.company   — заголовок называет компанию, а не банк/смартфон.
#
# ВАЖНО: имя субъекта живёт здесь, а не в src/. Гейт
# tests/test_no_entity_names.py падает, если имя из этого файла появится в
# исполняемом литерале модуля или докстринге. Второй проект на другом домене
# задаёт свой файл (PF_DOMAIN_DIR) и правит src/ ноль раз.
#
# Термины продублированы с «search» намеренно: у отбора выдачи свой список,
# отобранный замером, и выводить его из доменных терминов значило бы менять
# поведение поиска под видом переноса словаря.
