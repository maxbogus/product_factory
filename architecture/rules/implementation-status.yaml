# Статус реализации возможностей агента — машинное зеркало плана.
#
# Зачем дублировать документ машинно-читаемым реестром: гейт
# `implemented-means-module-and-test` проверяет, что каждая заявленная
# реализация действительно есть в коде (модуль и тест существуют), а
# каждая нереализованная — объяснена. Документ без такого гейта один раз
# разошёлся с кодом.
#
# status:
#   implemented       — реализовано и покрыто тестом;
#   partial           — реализована часть (указано, какая);
#   not_implemented   — не реализовано, указан гэп.
#
# module — путь к модулю в этом репозитории (обязателен для implemented);
# test   — путь к тесту (обязателен для implemented);
# reason — обязателен для всех статусов кроме implemented.
version: 1

methods:
  - id: metric-grounding
    title: Проверка расчётной метрики по строке источника
    status: implemented
    module: src/pf/sources.py
    test: tests/test_sources.py
    note: >
      Метрика проверяется по полям, а не по типу: схема ответа агента и
      внутренний класс — разные классы с одинаковыми полями.

  - id: row-index-by-table
    title: Номер строки в сводке считается по исходной таблице
    status: implemented
    module: src/pf/analysis.py
    test: tests/test_analysis.py
    note: Ряд (Series) несёт номера своих строк вместе с собой.

  - id: aggregate-by-recomputation
    title: Агрегат (среднее, медиана, размах, изменение) проверяется пересчётом
    status: implemented
    module: src/pf/sources.py
    test: tests/test_sources.py
    note: Входы агрегата видны в блоке расчётов, чтобы модель могла их скопировать.

  - id: report-metrics-with-status
    title: Отчёт показывает расчёты со статусом проверки
    status: implemented
    module: src/pf/report.py
    test: tests/test_state_journal.py
    note: Отклонённый расчёт нельзя выдать за посчитанный.

  - id: unique-grounds-counting
    title: Отчёт различает записи и уникальные основания
    status: implemented
    module: src/pf/report.py
    test: tests/test_state_journal.py
    note: Сборщик и аналитик цитируют одни и те же абзацы — это три факта, а не семь.

  - id: conclusion-grounding
    title: Основания вывода проверяются как основания факта
    status: implemented
    module: src/pf/workflow.py
    test: tests/test_conclusion_grounding.py
    note: >
      evidence стратегии, promise_grounding коммуникации и basis
      обязательств проходят ту же проверку: дословность цитаты и
      релевантность источника. Статус оснований вывода пишется в журнал.

  - id: conclusion-in-document
    title: Документ демонстрации показывает вывод и его основания
    status: implemented
    module: scripts/build_demo_doc.py
    test: tests/test_demo_doc_generated.py
    note: >
      Раздел «Вывод» собирается из журнала: направление, обязательства и
      статус оснований. Без него документ отвечал на вопрос «сколько
      оснований», но не на заданный вопрос.

  - id: metric-name-matches-row
    title: Имя показателя сверяется с колонкой строки
    status: implemented
    module: src/pf/sources.py
    test: tests/test_metric_semantics.py
    note: >
      Если строка сама называет показатель, метрика не может называть его
      иначе: под словом «удержание» не должно стоять значение абонентской
      базы.

  - id: claim-indicator-matches-row
    title: Утверждение о строке таблицы сверяется с показателем строки
    status: implemented
    module: src/pf/sources.py
    test: tests/test_sources.py
    note: >
      Число из строки подтверждало утверждение о любом показателе:
      «удержание клиентов — 87 %» опиралось на «абонентская база: 87».
      Строка сама объявляет, что за показатель в ней, и утверждение о
      другом отклоняется с причиной; словоформы сравниваются по основам,
      чтобы «число абонентов» не отвергалось из-за «абонентская база».

  - id: context-window-diversity
    title: Окно контекста не отдаётся одному источнику
    status: implemented
    module: src/pf/sources.py
    test: tests/test_retrieval.py
    note: >
      В demo-v9 пять абзацев окна были строками одной таблицы (Беларусь-2026,
      2007 год, доля спутникового ТВ), и абзацев корпуса по теме вопроса
      модель не видела. Теперь при ограничении окна от источника берётся не
      больше двух абзацев, остаток добирается по релевантности: если источник
      один, окно всё равно заполняется.

  - id: conclusion-respects-metric-verdict
    title: Отклонённый расчёт лишает якорь силы основания вывода
    status: implemented
    module: src/pf/workflow.py
    test: tests/test_conclusion_grounding.py
    note: >
      В demo-v9 вывод «подкреплено» опирался на те же две строки таблицы,
      на которых обе метрики были отклонены. Теперь якорь, непригодный для
      расчёта, не подкрепляет вывод, а отказ переезжает между фазами.
      Сравниваются якоря: отказ на другой строке вывод не гасит.

  - id: fact-contradictions
    title: Противоречащие факты объявляются пробелом
    status: implemented
    module: src/pf/workflow.py
    test: tests/test_contradictions.py
    note: >
      «Удержание падает» и «удержание не изменилось» не могут стоять рядом
      молча: дословность проверку прошли оба, смысл — нет.

  - id: review-on-new-data
    title: Пересмотр выводов при новых данных
    status: implemented
    module: src/pf/review.py
    test: tests/test_review.py
    note: >
      `pf review --session <id>` сравнивает записанный хеш с текущим файлом
      (выгрузки — по манифесту, материалы проекта — по `<файл>.meta.json`) и
      называет затронутые шаги и обязательства. Состояния различимы: «не
      изменилось», «требует пересмотра», «файл отсутствует», «хеш не
      записан». Пометка «требует пересмотра», а не «вывод неверен»: хеш
      меняется и при косметической правке. Журнал не переписывается,
      правило держит eval-кейс D-31. Не реализовано: пересмотр не обновляет
      обязательства и не запускает повторный прогон роли.

  - id: open-data-in-demo
    title: В демонстрации есть данные, из которых считается подтверждённый расчёт
    status: partial
    module: project/data
    test: tests/test_demo_data.py
    reason: >
      Добавлены открытые метрики (ARPU по кварталам, заявки на перенос
      номера), у каждого файла есть источник, дата и записанный хеш; из ряда
      ARPU выводится изменение, подтверждаемое пересчётом, — это проверяет
      tests/test_demo_data.py. Не реализовано: прямого ряда оттока в открытых
      источниках нет (проверено поиском, годовым отчётом и сайтами
      операторов), тарифы конкурентов недоступны (МТС 401, T2 503, Билайн
      рисует цены скриптами). Пробел назван в данных и в demo/BRIEF.md.

  - id: constraint-check
    title: Ограничения задачи проверяются кодом
    status: not_implemented
    reason: >
      Ограничения собираются в intake и больше нигде не читаются. В
      демо-прогоне ограничение брифа «цену снижать нельзя» потерялось, и
      выбранным направлением стало «Снизить цену на тарифы». Нужен
      src/pf/constraints.py и проверка направления в фазе strategy.

  - id: hypothesis-verification
    title: Гипотезы получают вердикт после целевого сбора
    status: partial
    module: src/pf/hypotheses.py
    test: tests/test_hypotheses.py
    reason: >
      Вердикт есть: supported / refuted / unknown ставит код по подтверждённым
      основаниям (pf.hypotheses.verdict_of), счёт вердиктов называет отчёт,
      правило держит eval-кейс D-22. Не реализовано целевое добирание
      оснований по гипотезам с вердиктом unknown — это T-08.

  - id: domain-reference
    title: Тематический справочник со своим статусом
    status: not_implemented
    reason: >
      Справочника нет. Без него модель опирается на приоритеты из весов,
      а не на явный проверяемый источник знания о применимости.

  - id: expert-role
    title: Экспертная роль после критики
    status: not_implemented
    reason: >
      Роли эксперта нет. Отличие от redteam: redteam критикует варианты,
      эксперт приносит знание о применимости идей к рынку.

  - id: demo-document-generated
    title: Документ демонстрации генерируется из журнала
    status: implemented
    module: scripts/build_demo_doc.py
    test: tests/test_demo_doc_generated.py
    note: >
      Документ собирается из журнала: подтверждённые основания — только
      те, что код подтвердил и ни разу не отверг; у каждого расчёта видна
      формула или честная пометка, что её нет. Тест сверяет документ с
      журналом, поэтому руками его править нельзя.

  - id: metric-formula-required
    title: У расчёта обязательна формула
    status: implemented
    module: src/pf/schemas.py
    test: tests/test_schemas.py
    note: >
      Без формулы число нельзя пересчитать, а значит — нельзя
      подтвердить. Докстринг схемы обещал это с самого начала, но поле
      принимало пустую строку, и модель присылала значение без формулы.

  - id: plan-progress-brief
    title: План получает пробелы, гипотезы и посчитанные метрики
    status: implemented
    module: src/pf/workflow.py
    test: tests/test_workflow_inputs.py
    note: >
      Планировщик видел только постановку задачи и потому либо повторял
      её, либо спрашивал заново то, на что уже есть ответ. Роутер по той
      же причине решал «куда дальше» вслепую.

  - id: routing-role-aliases
    title: Русские названия ролей понимаются роутером
    status: implemented
    module: src/pf/roles.py
    test: tests/test_routing.py
    note: >
      Модель отвечает «план», «Сбор источников», а реестр — английские
      идентификаторы. Без приведения решение роутера отбрасывалось как
      неизвестное, и работа шла по порядку.

  - id: journaled-decisions
    title: Решения роутера и второе мнение субагента попадают в журнал
    status: implemented
    module: src/pf/workflow.py
    test: tests/test_state_journal.py
    note: >
      Раньше и то и другое лежало в состоянии сессии, которое не
      поставляется вместе с результатом: исправление ошибочного выбора
      существовало, но было недоказуемо.

  - id: rejection-classes
    title: Отчёт показывает отказы по классам и долю расчётов с формулой
    status: implemented
    module: src/pf/report.py
    test: tests/test_rejection_reasons.py
    note: >
      Группировка нужна, чтобы видеть, что чинить: промпт, контекст или
      проверку. Это подпись для человека, а не решение о статусе. Класс
      берётся из причины, а не из первого знакомого слова: «ссылки нет»,
      «ввод человека» и «источник вне среза задачи» — три разных отказа
      (`D-45`).

  - id: quote-does-not-switch-rule
    title: Недословная и короткая цитата не отменяют проверку утверждения
    status: implemented
    module: src/pf/ground.py
    test: tests/test_ground.py
    note: >
      Наличие цитаты переключало проверку на другое правило, и верное
      утверждение отклонялось из-за парафраза или короткой цитаты. Теперь
      вид отказа назван (`Support.kind`), а проверка идёт полями; выдумка
      по-прежнему отклоняется (`D-02`, `D-45`).

  - id: scenario-step-gate
    title: Гейт проверяет подключение сценариев и определения шагов
    status: implemented
    module: scripts/contracts_check.py
    test: tests/test_contracts.py
    note: >
      pytest-bdd строит тесты из файла сценариев, и в исходниках их нет:
      проверка по тексту тестов объявляла непокрытыми все сценарии.
      Гейт разбирает AST и ловит именно ту ошибку, что была в прогоне, —
      шаг без определения.

  - id: bench-model-per-provider
    title: Замер ставит модель в поле выбранного провайдера
    status: implemented
    module: src/pf/bench.py
    test: tests/test_bench.py
    note: >
      Имя из `--models` писалось в `ollama_model`, и облачный прогон шёл не
      на той модели, что просили: клиент берёт `llm_model`. Теперь поле
      зависит от провайдера.

  - id: cloud-max-tokens
    title: Облачному провайдеру лимит ответа поднимается
    status: implemented
    module: src/pf/config.py
    test: tests/test_llm_client.py
    note: >
      На локальном лимите 2400 токенов JSON стратегии приходил обрезанным,
      и прогон на DeepSeek падал на «JSON не закрыт». Для нелокального
      провайдера лимит не ниже `CLOUD_MAX_TOKENS`.

  - id: explicit-context-window
    title: Окно контекста задаётся явно, обрезка промпта видна в журнале и отчёте
    status: implemented
    module: src/pf/llm.py
    test: tests/test_context_window.py
    note: >
      Без `num_ctx` Ollama брал 4096 и обрезал промпт: на сохранённых
      журналах 56 шагов упирались ровно в 4096 токенов, и начало
      контекста отбрасывалось молча. Теперь окно передаётся в запросе,
      сочетание «ответ не влезает в окно» отклоняется настройками, а
      признак обрезки пишется в `detail["context"]` шага и попадает в
      отчёт строкой и оговоркой (D-20).


  - id: numeric-tolerance
    title: Числа сверяются с допуском до десятой доли
    status: implemented
    module: src/pf/lexical.py
    test: tests/test_lexical.py
    note: >
      «77,3» подтверждает «77,26», потому что это округление, а не
      подмена. Абсолютный допуск включается только для чисел от единицы:
      для 0,2 допуск 0,1 — это половина значения. Метрики используют тот
      же допуск (`src/pf/sources.py`).

  - id: lemma-synonyms
    title: Слова сравниваются по леммам и словарю синонимов
    status: implemented
    module: src/pf/synonyms.py
    test: tests/test_synonyms.py
    note: >
      «Клиенты» в утверждении покрываются «абонентами» источника. Точные
      термины (числа, бренды, аббревиатуры) синонимами не заменяются, а
      добавленное отрицание отклоняется: словарь расширяет понимание, но
      не ослабляет проверку.

  - id: oov-recognition-queue
    title: Незнакомые слова попадают в очередь распознания
    status: implemented
    module: src/pf/lexicon.py
    test: tests/test_lexicon.py
    note: >
      Слово, которого нет в словаре и не знает морфология, не теряется:
      оно пишется в `knowledge/lexicon/oov.jsonl` (append-only), а
      `pf lexicon enrich` предлагает понятие. Записи со статусом
      `proposed` в проверке не участвуют — подтверждает человек.

  - id: lexical-coverage
    title: Отчёт показывает лексическое покрытие и топ незнакомых слов
    status: implemented
    module: src/pf/lexicon.py
    test: tests/test_state_journal.py
    note: >
      Покрытие — измеримый след работы со словарём: видно, сколько слов
      проверка поняла, а сколько ушло в очередь. Это соседняя метрика
      рядом с долей подтверждённых оснований, а не замена ей.

  - id: external-source-needs-review
    title: Внешний и иностранный источник помечаются «требует проверки»
    status: implemented
    module: src/pf/ground.py
    test: tests/test_conclusion_grounding.py
    note: >
      Ссылка на веб-источник раньше отклонялась как «источник не найден
      среди собранных», хотя страница скачана. Теперь дословность
      проверяется по скачанной странице, а статус остаётся
      «требует проверки»: подтвердить внешний источник нечем. Отчёт
      показывает такие основания отдельным разделом.

  - id: answer-budget-hint
    title: Модель знает лимит ответа заранее
    status: implemented
    module: src/pf/workflow.py
    test: tests/test_request_format.py
    note: >
      Лимит уже режет генерацию, но модель об этом не знала и присылала
      обрезанный JSON. Теперь в запросе есть бюджет ответа, в том числе
      явный лимит из задачи («не более 200 слов»).

  - id: constraints-reach-roles
    title: Ограничения задачи попадают в запрос каждой роли
    status: implemented
    module: src/pf/workflow.py
    test: tests/test_request_format.py
    note: >
      Ограничения собирались на входе и дальше не читались: в
      демо-прогоне «цену снижать нельзя» потерялось, и выбранным
      направлением стало «снизить цену». Передача в запрос не заменяет
      проверку направления — гэп `constraint-check` остаётся, — но
      молчаливой потери больше нет.

  - id: variant-poles
    title: Оба полюса вариантов проверяются по набору, а не по маркерам
    status: implemented
    module: src/pf/schemas.py
    test: tests/test_schemas.py
    note: >
      Набор без «оставить как есть» или без «закрыть направление» отклоняется,
      а маркеры выводятся из фактических названий вариантов. Раньше маркер был
      свободной строкой: в двух сохранённых прогонах из 25 он стоял при наборе,
      где такого варианта не было.

  - id: plan-numbers-are-grounded
    title: Числа плана и обязательств сверяются с расчётами
    status: implemented
    module: src/pf/workflow.py
    test: tests/test_success_criteria.py
    note: >
      Проверка критериев сравнивала только основы слов, и критерий
      «увеличение удержания на 5 %» проходил по слову «удержание», а число
      не сверялось ни с чем: в demo-v9 из плана стояло «удержание на
      уровне 87 %», хотя 87 — абонентская база МТС. Теперь каждая величина
      с единицей сверяется с расчётом того же показателя, а показатель
      расчёта берётся из строки источника. Фаза решения проверяется так же.

  - id: row-selection-by-indicator
    title: Строка таблицы отбирается по показателю, а не по длине текста
    status: implemented
    module: src/pf/sources.py
    test: tests/test_retrieval.py
    note: >
      Строка без совпадений с запросом получала вес 1/√(длина текста), и в
      окно попадали «МТС Беларусь 2026» и «доля на рынке спутникового ТВ»:
      порядок решала длина URL в колонке «источник». Теперь балл считается
      по полям строки (показатель, субъект, прочее содержание), провенанс в
      оценку не входит, доменный добор возможен только для строки, чей
      показатель называет объект отрасли, а ничьи разрешает порядок
      источника.

  - id: translation-layer
    title: Перевод внешнего материала с проверкой сохранности чисел
    status: implemented
    module: src/pf/translate.py
    test: tests/test_translate.py
    note: >
      Английский источник проверялся только по числам: дословность в нём
      недостижима, а слова, термины и отрицание не сверялись вовсе. Теперь
      перевод лежит рядом с оригиналом и основанием не является, а числа,
      единицы и идентификаторы сверяются мультимножеством: потерянное и
      придуманное число одинаково блокируют перевод, и непригодный перевод
      в кэш не пишется.

  - id: answer-language-declared
    title: Язык ответа задан явно и общий для всех ролей
    status: implemented
    module: src/pf/workflow.py
    test: tests/test_prompts_language.py
    note: >
      В промптах девяти ролей требования языка не было ни в одном. Пока
      контекст был русским, это было незаметно; на английском материале
      модель отвечала по-английски, и JSON приходил с русскими ключами и
      английскими значениями. Блок добавляется один раз, в общих дополнениях
      к запросу, и не отменяет дословности цитаты.

  - id: plan-number-own-calculation
    title: Число плана сверяется со своим расчётом или со своей ссылкой на строку
    status: implemented
    module: src/pf/workflow.py
    test: tests/test_success_criteria.py
    note: >
      «Тот же показатель» определялся пересечением любых основ: слова «период»
      в имени расчёта по ключевой ставке хватало, чтобы верные числа MNP
      отклонялись с чужим показателем в причине. Теперь служебные основы
      вычитаются (`pf.lexical.indicator_stems`), а число, названное вместе со
      ссылкой `[путь#rowN]`, подтверждается тем расчётом, на который ссылка
      указывает (`D-40`).

  - id: conclusion-grounds-match-indicator
    title: Показатель основания сверяется с показателем вывода
    status: implemented
    module: src/pf/workflow.py
    test: tests/test_conclusion_grounding.py
    note: >
      Дословная цитата не отвечает на вопрос, тот ли показатель подтверждён:
      вывод про удержание держался на уровне ARPU. Основание с чужим
      показателем понижается до отклонённого **по каждому ключу**
      (`indicator-demotion`), поэтому единственное чужое основание даёт
      «неподкреплено», а одно из двух — «подкреплено частично». Отчёт
      называет оба показателя. Основания без названного показателя правило
      не судит (`D-41`, `D-46`).

  - id: report-honest-counts
    title: Отчёт не выдаёт записи за основания и называет непригодность прогона
    status: implemented
    module: src/pf/report.py
    test: tests/test_report_conclusion.py
    note: >
      Доля подписана «записей»; одинаковые отказы схлопываются с числом
      повторов; отчёт без вывода начинается строкой «Прогон не даёт решения»;
      обязательства без владельца названы числом (`D-42`).

  - id: report-shows-variants-and-ordinals
    title: Отчёт показывает набор вариантов с полюсами и считает шаги по номерам
    status: implemented
    module: src/pf/report.py
    test: tests/test_report_conclusion.py
    note: >
      Варианты писались в журнал, но в отчёт не попадали, и отсутствие набора
      приписывалось модели. Дубль номера шага (наследие двух запусков в один
      журнал) называется словом, а не складывается в «12 шагов» (`D-43`).

  - id: conclusion-rule-recorded
    title: Статус оснований вывода записывается вместе с именем правила
    status: implemented
    module: src/pf/ground.py
    test: tests/test_report_conclusion.py
    note: >
      Журнал хранил статус без имени правила, и `demo-v9` печатал
      «подкреплено» рядом с «отклонено» по одной и той же строке: правило,
      считавшее посчитанное значение цитатой, к тому времени сняли (`D-36`).
      Теперь `pf.ground.CONCLUSION_RULE` едет в журнал вместе со статусом,
      отчёт подписывает унаследованный статус «по правилу прогона» и называет
      противоречие внутри журнала (`D-44`).

  - id: conclusion-assumptions
    title: Допущения вывода стоят рядом с выводом
    status: implemented
    module: src/pf/schemas.py
    test: tests/test_schemas.py
    note: >
      «Осознанные отказы» отвечают на другой вопрос — что сознательно не
      учли. `ProductStrategy.assumptions` называет условия, при которых
      решение работает; отчёт печатает блок рядом с выводом, а для прогона
      текущим правилом без допущений говорит, что их нет. Унаследованный
      журнал не судится: поля тогда не было.

  - id: arxiv-channel
    title: arXiv как канал источников с пометкой «не рецензирован»
    status: implemented
    module: src/pf/arxiv.py
    test: tests/test_arxiv.py
    note: >
      Препринт не выдаётся за статью: `SearchHit.peer_reviewed` едет вместе с
      результатом, а не остаётся словом в сниппете. Канал вызывается своей
      командой (`pf web --arxiv`), потому что общий фильтр релевантности
      считает основы русских слов и молча выбросил бы английские заголовки
      (`D-26`).

  - id: conclusion-number-cap
    title: Число плана без своего расчёта не даёт статусу «подкреплено»
    status: implemented
    module: src/pf/workflow.py
    test: tests/test_success_criteria.py
    note: >
      `_check_plan_numbers` отдаёт структуру: вид расхождения
      (`number_mismatch` / `foreign_indicator` / `no_calculation`) и признак
      «факт / цель». Величины-факты без расчёта своего показателя едут в
      `unsupported_numbers` статуса; цели плана понижают только замечанием,
      иначе каждый вывод с планом был бы «подкреплено частично». Дефис
      диапазона больше не читается как минус. Замер на пяти журналах: одно
      срабатывание (`demo-v9`, база 87 %) и ноль ложных понижений
      (`D-47`, `reports/replay/2026-11-09-plan-number-cap.json`).

  - id: unknown-hypothesis-followup
    title: Добор оснований по неизвестным гипотезам и пробелам
    status: implemented
    module: src/pf/hypotheses.py
    test: tests/test_hypotheses.py
    note: >
      Узлы добора — гипотезы с вердиктом `unknown` и пробелы; противоречия
      поиском не закрываются и называются отдельно. Поиск лексический
      (`corpus.search` + `score_passages`), дубли отсекаются по ссылке и по
      тексту (`pf.policy.content_key`), исходы (`new` / `duplicate` / `empty`
      / `no_progress`) считает `pf.policy`, а не код добора. Кандидат — не
      основание: вердикт и статус он не меняет, отчёт говорит это словами
      (`D-15`, `D-37`). Выигрыш ранжирования не измерен: журналов с разными
      вопросами нет (`n = 1`).

  - id: frontier-search
    title: Поиск по фронтиру пробелов (BFS) с причинами остановки
    status: not_implemented
    reason: >
      Замысел описан в docs/decisions.md D-15. Сделан один шаг — добор по
      неизвестным гипотезам и пробелам (`unknown-hypothesis-followup`):
      политика `src/pf/policy.py` подключена к разбору, причины остановки
      называются, счётчики попадают в отчёт. Не реализованы уровни и глубина
      BFS, бюджет расширения и решение о возврате по фронтиру: возврат к
      плану остаётся `MAX_REPLANS = 1` с проверкой «есть ли пробелы». Нужен
      `src/pf/frontier.py`.


