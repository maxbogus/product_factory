# Границы доверия — реестр зон (source of truth для схем и fitness-функций)
#
# Каждая зона, упомянутая в architecture/sequences/*.mmd, обязана быть
# объявлена здесь. Нарушение = make contracts-check возвращает exit 1.
#
# Зона отвечает на вопрос «откуда пришли данные и можно ли им доверять».
# Ключевое различие агента: данные из разных зон имеют разный статус
# подтверждения, и смешивать их нельзя.
#
# trust_level:
#   untrusted   — данные нельзя брать за основу без проверки кодом;
#   semi-trusted — известен источник, но содержимое может нести инструкции;
#   trusted     — данные можно брать за основу без дополнительной проверки.
version: 1

zones:
  - id: task-input
    diagram_id: task_input
    name: Ввод руководителя
    owner: Руководитель продукта
    trust_level: untrusted
    contains_pii: true
    description: >
      Вопрос и ограничения от руководителя. Формулировка может содержать
      косвенные инструкции («не упоминай X»), поэтому ограничения из неё
      извлекаются и проверяются отдельно, а не исполняются как есть.

  - id: model-output
    diagram_id: model_output
    name: Выход модели
    owner: Модель (локальная LLM)
    trust_level: untrusted
    contains_pii: false
    description: >
      Ответ роли: факты, гипотезы, метрики, варианты, стратегия. Выход
      модели недоверен по определению: модель выдумывает ссылки, путает
      строки таблиц и подставляет числа без основания. Единственное,
      что делает выход основанием, — проверка кодом.

  - id: grounding-gate
    diagram_id: grounding_gate
    name: Проверка оснований
    owner: Код (pf.ground, pf.sources)
    trust_level: trusted
    contains_pii: false
    description: >
      Единственное место, где решается, что подтверждено. Цитата должна
      дословно встречаться в источнике; величина — пересчитываться по
      указанной строке. Запись в журнал идёт только отсюда: модель не
      может сама объявить своё основание подтверждённым.

  - id: materials
    diagram_id: materials
    name: Материалы проекта
    owner: Руководитель продукта
    trust_level: semi-trusted
    contains_pii: true
    description: >
      Свои документы и таблицы из project/. Provenance известен (файл,
      хеш), но содержимое может содержать инструкции — поэтому цитаты
      из них проходят ту же проверку, что и любые другие.

  - id: corpus
    diagram_id: corpus
    name: Локальный корпус
    owner: Проект
    trust_level: trusted
    contains_pii: false
    description: >
      Википедия, зафиксированная в data/wiki/. Открытые данные без
      инструкций; содержимое не меняется от прогона к прогону, поэтому
      ссылка на статью остаётся проверяемой.

  - id: web
    diagram_id: web
    name: Внешние источники
    owner: Сторонние
    trust_level: untrusted
    contains_pii: false
    description: >
      Найденное в интернете (RSS, Bing News, разобранные страницы).
      Дословность проверяется, но статус всегда «требует проверки»:
      подтверждённым внешний источник быть не может.

  - id: knowledge
    diagram_id: knowledge
    name: Тематический справочник
    owner: Проект
    trust_level: semi-trusted
    contains_pii: false
    description: >
      Знание о применимости: драйверы, метрики, ориентиры. Это НЕ факт
      о конкретном кейсе, поэтому у него отдельный статус и его нельзя
      смешивать с подтверждёнными основаниями по делу.

  - id: journal
    diagram_id: journal
    name: Журнал шагов
    owner: Код
    trust_level: trusted
    contains_pii: true
    description: >
      Append-only запись хода работы: что спросили, что подтвердилось,
      что отклонено и почему. Не переписывается — по нему восстанавливается
      прогон и проверяется отчёт.

  - id: human
    diagram_id: human
    name: Решение человека
    owner: Руководитель продукта
    trust_level: trusted
    contains_pii: true
    description: >
      Ответ на вопрос агента (pf answer) и подтверждение ограничений.
      Ответ человека попадает в контекст следующего шага — иначе работа
      продолжилась бы вслепую.
