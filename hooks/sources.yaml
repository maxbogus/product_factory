# Хуки: действия по событиям рабочего процесса.
#
# Формат:
#   rules:
#     - event: <событие>
#       when: "<условие с порогом>"
#       action: "<что сделать>"
#
# Хук не может отменить сделанное: он либо расширяет вход, либо
# останавливает работу. Пороги описаны в docs/decisions.md.
rules:
  - event: sources.collected
    when: "подтверждённых оснований < 2"
    action: "расширить план исследования: искать другие открытые источники"

  - event: budget.exhausted
    when: "расход >= предела"
    action: "остановить работу с отчётом о достигнутом расходе"

  - event: facts.contradicted
    when: "противоречий > 0"
    action: "назвать ось противоречия и показать раздел «Противоречия» в отчёте"

