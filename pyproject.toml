[project]
name = "product-factory-strategist"
version = "0.1.0"
description = "Стратег Фабрики продуктов — ИИ-агент для руководителя цифрового продукта"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pymorphy3>=2.0.6",
]

[project.scripts]
pf = "pf.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "mock: детерминированные тесты без обращения к LLM",
    "slow: требует локальной модели Ollama",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[dependency-groups]
dev = [
    "mcp>=2.3.0",
    "types-pyyaml>=6.0.12.20261103",
    "wikipedia>=1.4.0",
]
